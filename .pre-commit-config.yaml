minimum_pre_commit_version: 3.2.0 # necessitated by Lucas-C's hooks
default_install_hook_types: [pre-commit, pre-push]
exclude: "thirdParty"
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        types_or: [file]
        files: \.(cpp|def|h|cu|tpp|kernel|loader|unitless|hpp|param)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [-b, dev]
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude_types: [markdown, rst]
        # Canonical license texts contain trailing whitespace as published.
        exclude: ^LICENSES/
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: \.tpl$
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--no-ensure-ascii"
          - "--no-sort-keys"
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-tabs
        types_or: [file]
        exclude_types: [rst, tex, tsv]
        # Canonical license texts (e.g. CC-BY-4.0) use tabs for line wrapping.
        exclude: ^LICENSES/
      - id: remove-tabs
        types_or: [file]
        exclude_types: [rst, tex, tsv]
        exclude: ^LICENSES/
      - id: forbid-crlf
      - id: remove-crlf
  - repo: local
    hooks:
      - id: check_cpp_code_style
        name: check_cpp_code_style
        entry: share/ci/check_cpp_code_style.sh
        language: system
        files: \.(cpp|def|h|cu|tpp|kernel|loader|unitless|hpp|param)$
        pass_filenames: false
        # This hook runs on all files which is why it feels a bit too heavy-weight
        # for running before every commit. The CI currently runs manually, so it's
        # still running there and can be run manually and pre-push on demand.
        # TODO: Adjust the script to take filenames, so that we can pass the
        # filenames and speed things up before commits.
        stages: [manual, pre-push]
      # 'reuse lint' checks the whole tree (~1 s), so it is light enough to run
      # before every commit. The 'manual' stage makes the pull-request-validation
      # CI job (pre-commit run --all-files --hook-stage manual) enforce REUSE
      # compliance. The 'reuse' CLI is pinned in requirements_pre-commit.txt.
      - id: reuse-lint
        name: REUSE compliance (reuse lint)
        entry: reuse lint
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.10
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [python, pyi, jupyter]
        # Rule E721 is about using isinstance()
        # but lib/python/picongpu/pypicongpu/rendering/renderer.py
        # is strict about types. Could be solved locally but I think this is fine.
        args: [--fix, --ignore, E721]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        args: ["--line-length", "120"]
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: require-ascii
        # Reasons for exclusion:
        # - rst files: This is documentation.
        # - CHANGELOG.md: Contains author names that might include special characters for correct spelling.
        # - .zenodo.json: Contains author names that might include special characters for correct spelling.
        # - unit_dimension.py: Contains theta as the symbol for temperature.
        exclude_types: [rst]
        # LICENSES/ holds canonical texts with typographic quotes (e.g. LGPL-3.0).
        exclude: ^LICENSES/|CHANGELOG.md|.zenodo.json|lib/python/picongpu/picmi/particle_functor/unit_dimension.py
  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.22.1
    hooks:
      - id: gersemi
        args: [-c, --diff, --no-warn-about-unknown-commands]
      - id: gersemi
        args: [-i, --no-warn-about-unknown-commands]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.5.0"
    hooks:
      - id: pyproject-fmt
        # The default is 3.13, which would strip the 3.14 classifier.
        args: ["--max-supported-python", "3.14"]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      # Commit-time filter: strips outputs, execution counts and default metadata, normalizes cell ids.
      # Does not rewrite already-committed history.
      - id: nbstripout
        types: [jupyter]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      # Validates each notebook against the official nbformat v4 schema.
      # Duplicate cell ids aren't expressible in JSON Schema; nbstripout makes them unique on each commit.
      - id: check-jsonschema
        name: check notebook against the nbformat v4 schema
        files: \.ipynb$
        types: [jupyter]
        args:
          - --schemafile=https://raw.githubusercontent.com/jupyter/nbformat/v5.11.1/nbformat/v4/nbformat.v4.schema.json

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "picongpu"
version = "0.9.0.dev"
description = "Python package for PIConGPU"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# dependecies list generated with
# https://gist.github.com/pordyna/ff27ce949a8e944fe30252f47b5b831f
dependencies = [
  "cwltool",
  "h5py",
  "imageio",
  "jsonschema>=4.23",
  "matplotlib",
  # temporary bug-fix branch, should point to an upcoming release including this in the future:
  "moosetash @ git+https://github.com/chillenzer/moosetash.git@fix-none-handling",
  "mpmath>=1.3",
  "numpy>=1.26.2",
  "openpmd-api>=0.16.1",
  "pandas>=2.2.3",
  "particle>=0.25.1",
  "periodictable>=1.7.1",
  # This commit hash points to branch: pydantic-refactoring-picongpu-base,
  # so we don't loose it if someone force-pushes to the main feature branch.
  "picmistandard @ git+https://github.com/chillenzer/picmi.git@c1d662238fc6642ca683826df688ccca12ed3765",
  "pillow",
  "pint",
  "pydantic>=2.6.4",
  "pyyaml",
  "questionary>=2",
  "referencing>=0.35.1",
  "roc-validator",
  # Temporarily choosing the master here
  # because the latest release doesn't yet support RO-Crate v1.2
  # and it doesn't seem reasonable to build a new feature on top of an outdated standard.
  "rocrate @ git+https://github.com/ResearchObject/ro-crate-py@master",
  "scipy>=1.12",
  "sympy>=1.14",
  "tomli-w>=1.2",
]

optional-dependencies.test = [ "pytest>=9" ]

scripts.pic-deps = "picongpu.pic_deps:main"

scripts.picrc-builder = "picongpu.picrc_builder:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [ "picongpu" ]

[tool.hatch.build.targets.wheel.force-include]
"../../include" = "picongpu/core/include"
"../../etc" = "picongpu/core/etc"
"../../bin" = "picongpu/core/bin"
"../../src/tools/bin" = "picongpu/core/bin"
"../../share/picongpu/examples" = "picongpu/core/share/picongpu/examples"
"../../thirdParty" = "picongpu/core/thirdParty"

[tool.hatch.build.targets.sdist]
packages = [ "picongpu" ]
[tool.hatch.build.targets.sdist.force-include]
"../../include" = "picongpu/core/include"
"../../etc" = "picongpu/core/etc"
"../../bin" = "picongpu/core/bin"
"../../src/tools/bin" = "picongpu/core/bin"
"../../share/picongpu/examples" = "picongpu/core/share/picongpu/examples"
"../../thirdParty" = "picongpu/core/thirdParty"

[tool.ruff]
# Curated pydocstyle subset for the API reference (issue #194).
# D101/D102/D103 demand class/method/function docstrings; the field-level
# prose is guarded separately by share/ci/check_field_descriptions.py.
lint.extend-select = [ "D101", "D102", "D103" ]
# Scope the docstring rules to the picmi package (the rendered API reference).
# TEMPORARY SCAFFOLD: ruff has no baseline, so a `per-file-ignores` entry
# suppresses D101/D102/D103 for the *whole* file, not just the pre-existing
# violations -- new undocumented code added to one of these files is NOT caught
# by ruff. The follow-up prose PR removes these entries file-by-file as the
# docstrings are written; until then the authoritative new-code ratchet for the
# invariants it covers is share/ci/check_field_descriptions.py, whose
# per-class/per-field checks fail on any *new* violation (including in
# grandfathered files).
# Remove entries as their docstrings are added in the (b) prose PR.
lint.per-file-ignores."!picongpu/picmi/**" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/copy_attributes.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/backend_config.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/binning.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/checkpoint.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/energy_histogram.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/field_dump.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/particle_dump.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/phase_space.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/radiation.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/diagnostics/timestepspec.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/distribution/AnalyticDistribution.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/distribution/CylindricalDistribution.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/distribution/Distribution.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/distribution/FoilDistribution.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/distribution/GaussianDistribution.py" = [ "D101", "D102", "D103" ]
lint.per-file-ignores."picongpu/picmi/distribution/UniformDistribution.py" = [ "D101", "D102", "D103" ]

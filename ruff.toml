# Ruff configuration for PIConGPU.
# Kept intentionally minimal: it only relaxes unused-import (F401) handling
# for `__init__.py` files. This is what allows picmi/pypicongpu packages to
# serve as explicit re-export hubs (`as X as X`, no `__all__`) without the
# linter fighting the pattern. All other rules use ruff's defaults; the
# pre-commit hook additionally passes `--ignore E721`.
#
# NOTE: ruff 0.12.x (pinned by .pre-commit-config.yaml) deprecates this
# option and makes it inert, so the explicit `X as X` re-export idiom is the
# actual mechanism keeping `__init__.py` F401-clean today. The setting is
# kept as the documented intent and for forward compatibility.

[lint]
ignore-init-module-imports = true
